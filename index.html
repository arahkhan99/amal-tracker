<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F4EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zad">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Zad</title>
<!-- painted before any script or stylesheet loads, so opening the app never flashes a blank or wrong-coloured screen -->
<style>html,body{background:#F8F4EA;margin:0}@media (prefers-color-scheme:dark){html,body{background:#16221C}}</style>
<script>
  // Safety net: the app hides the native splash after its first paint (src/main.js). If anything goes wrong before
  // that, hide it anyway after 4 s so the app can never get stuck behind the splash.
  setTimeout(function () { try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen && window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {} }, 4000);
</script>
</head>
<body>
<!-- the star pattern of the set-up screens and the lock screen (views/onboarding.js); the main screens have none -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="st" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M30 2 L36 24 L58 30 L36 36 L30 58 L24 36 L2 30 L24 24 Z" fill="none" stroke="#E5C55C" stroke-width="1"/><path d="M13 13 L47 13 L47 47 L13 47 Z" fill="none" stroke="#E5C55C" stroke-width=".6" transform="rotate(45 30 30)"/></pattern></defs></svg>

<div class="stage">
<div class="phone" id="phone">
  <div class="screen" id="screen">

    <!-- ONBOARDING -->
    <section class="view" id="v-onboard"></section>

    <!-- TODAY tab, chapters Now · Today (drawn by views/home.js; every label comes from src/strings.js) -->
    <section class="view" id="v-home"></section>

    <!-- CALENDAR: past days, opened from Today (views/calendar.js) -->
    <section class="view" id="v-calendar"></section>

    <!-- READ tab (filled by views/tools/index.js) -->
    <section class="view" id="v-tools"></section>

    <!-- MAKE-UPS (qada) -->
    <section class="view" id="v-qada"></section>

    <!-- PROGRESS (drawn by views/progress.js) -->
    <section class="view" id="v-progress"></section>

    <!-- COMMUNITY: Zad Plus only, a placeholder for now (views/community.js) -->
    <section class="view" id="v-community"></section>

    <!-- QIBLA: a full page, opened from the Now card and Settings (views/qibla-page.js) -->
    <section class="view" id="v-qibla"></section>

    <!-- SETTINGS (drawn by views/settings.js) -->
    <section class="view" id="v-settings"></section>
  </div>

  <nav class="nav" id="nav" aria-label="Main"></nav>

  <div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="lock" id="lock" hidden></div>
</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
