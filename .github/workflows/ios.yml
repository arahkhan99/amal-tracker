name: Build iPhone app
# Builds an unsigned AmalTracker.ipa on a GitHub-hosted Mac. Sign and install it from Windows
# with Sideloadly or AltServer using a free Apple ID (see README).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry AmalTracker.ipa Payload
          ls -lh AmalTracker.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AmalTracker-ipa
          path: AmalTracker.ipa
      - name: Attach to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.0.0 AmalTracker.ipa --clobber
